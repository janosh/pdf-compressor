name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Build wheels and publish the current version (skips registries that already have it)
        type: boolean
        default: false

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test

  # Real API round trip. Spends iLovePDF quota, so only on releases and manual non-publish runs.
  live-smoke-test:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.publish)
    runs-on: ubuntu-latest
    env:
      ILOVEPDF_PUBLIC_KEY: ${{ secrets.ILOVEPDF_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Compress two PDFs against the live API
        run: |
          cargo run -- --report-quota
          cp tests/dummy.pdf /tmp/a.pdf && cp tests/dummy.pdf /tmp/b.pdf
          cargo run -- /tmp/a.pdf /tmp/b.pdf --write-stats-path /tmp/stats.csv
          test -s /tmp/a-compressed.pdf && test -s /tmp/b-compressed.pdf
          cat /tmp/stats.csv

  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: j178/prek-action@v3.1.0 # v3 publishes no moving major tags

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: lycheeverse/lychee-action@v2
        with:
          # api.ilovepdf.com is an API base URL (DEFAULT_API_URL), not a page: its root is a 404
          args: --accept 100..=103,200..=299,403,429,500 --exclude "^https://api\.ilovepdf\.com/?$" -- ./**/*.{md,rs,toml,yml,yaml}

  # catch packaging breakage on PRs instead of at release time
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Check crate packaging
        run: cargo publish --dry-run

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist

      - name: Smoke-test wheel
        run: |
          pipx install dist/*.whl
          pdf-compressor --version

  wheels:
    if: github.event_name == 'release' || inputs.publish
    needs: [tests, package]
    strategy:
      fail-fast: false # one broken platform shouldn't hide the others' results
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          # ring's aarch64 assembly needs a newer GCC than the manylinux2014 cross image has
          - { os: ubuntu-latest, target: aarch64, manylinux: "2_28" }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: x86_64 }
          - { os: macos-latest, target: aarch64 }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: ${{ matrix.manylinux || 'auto' }}

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'gnu' }}
          path: dist

  release:
    if: github.event_name == 'release' || inputs.publish
    needs: wheels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for trusted publishing, no stored registry tokens
    steps:
      - uses: actions/checkout@v7

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      # crates.io first: it re-verifies the build, so a failure there stops PyPI going out of sync
      - uses: dtolnay/rust-toolchain@stable

      # skipping an already-published version makes release runs safe to repeat
      - name: Check if crates.io already has this version
        id: crates-io
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          url="https://crates.io/api/v1/crates/pdf-compressor/$version"
          status=$(curl -s -o /dev/null -w '%{http_code}' -A "pdf-compressor-release-ci" "$url")
          if [ "$status" = 200 ]; then
            echo "pdf-compressor $version is already on crates.io, skipping publish"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = 404 ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "unexpected HTTP $status from $url" && exit 1
          fi

      # trusted publisher configured on crates.io: exchanges the OIDC token for a short-lived one
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.crates-io.outputs.exists == 'false'
        id: crates-io-auth

      - name: Publish to crates.io
        if: steps.crates-io.outputs.exists == 'false'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

      - uses: astral-sh/setup-uv@v10

      # trusted publisher configured on pypi.org for this repo + workflow; --check-url skips
      # files PyPI already has, so re-runs don't fail
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*
