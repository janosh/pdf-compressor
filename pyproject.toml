# Ships the Rust CLI as a PyPI wheel so `pip install pdf-compressor` keeps working.
# Version and metadata come from Cargo.toml.
[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "pdf-compressor"
dynamic = ["version"]
description = "CLI for batch compressing PDFs with iLovePDF.com"
readme = "readme.md"
license = { file = "license" }
keywords = ["cli", "compression", "ilovepdf", "pdf"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Environment :: Console",
]

[project.urls]
Homepage = "https://github.com/janosh/pdf-compressor"
Package = "https://pypi.org/project/pdf-compressor"

[tool.maturin]
bindings = "bin"
