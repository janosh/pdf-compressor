# Ships the Rust CLI as a PyPI wheel. Metadata comes from Cargo.toml, except the license file,
# which only ends up in the wheel when listed here.
[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "pdf-compressor"
dynamic = ["version", "description", "readme", "license", "keywords", "authors", "urls"]
license-files = ["license"]
